worker_processes auto;
worker_rlimit_nofile 65536;
pid __NGINX_DIR__/nginx.pid;
error_log __NGINX_DIR__/logs/error.log warn;

events {
    worker_connections 2048;
}

http {
    include __MIME_TYPES__;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 300;
    keepalive_requests 100000;
    gzip on;
    gzip_comp_level 5;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    # 配合 start_nginx_gateway.sh 的预压缩步骤（MOBILEGYM_PRECOMPRESS，默认开启）：
    # 命中 dist 里的 .gz 旁路文件时直接 sendfile，跳过逐请求现压。
    gzip_static on;

    # 静态热点文件的 fd/stat 缓存，降低高并发 episode 下的 open/stat 开销
    open_file_cache max=10000 inactive=60s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    log_format debug_502 '$time_local $status $request_length $bytes_sent "$request" "$upstream_addr" "$upstream_status"';
    # 带逐请求耗时的格式；排查性能时把下面注释的 access_log 打开
    log_format timed '$time_local $status $request_time $request_length $bytes_sent "$request"';
    map $status $log_non200 {
        200 0;
        304 0;
        default 1;
    }
    access_log __NGINX_DIR__/logs/access.log debug_502 if=$log_non200;
    # access_log __NGINX_DIR__/logs/access_timed.log timed;

    client_body_temp_path __NGINX_DIR__/temp/client_body;
    proxy_temp_path       __NGINX_DIR__/temp/proxy;
    fastcgi_temp_path     __NGINX_DIR__/temp/fastcgi;
    uwsgi_temp_path       __NGINX_DIR__/temp/uwsgi;
    scgi_temp_path        __NGINX_DIR__/temp/scgi;

    server {
        # HTTPS 监听：远程访问用（HTTP/2 + TLS）。注意自签证书 + Chromium
        # --ignore-certificate-errors 组合下浏览器**不写 HTTP 缓存**，每个
        # episode 全量冷载 —— 本机评测请用下面的 plain HTTP 端口。
        listen __PORT__ ssl backlog=4096;
        # Plain HTTP 监听（本机评测通道，浏览器缓存可用）。与 HTTPS 共用同一
        # server 块，天然复用下方全部 location 与缓存头，不会双份漂移。
        listen __HTTP_PORT__ backlog=4096;
        http2 on;

        ssl_certificate __NGINX_DIR__/ssl/localhost.crt;
        ssl_certificate_key __NGINX_DIR__/ssl/localhost.key;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1h;
        ssl_protocols TLSv1.2 TLSv1.3;

        root __ROOT__/dist;
        index index.html;

        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location /@app-assets/ {
            expires 1y;
            try_files $uri =404;
        }

        location /sdcard/ {
            expires 1h;
            add_header Cache-Control "public";
        }

        # IME 拼音词典（~15MB JSON，无内容哈希）与系统图标：中等时长缓存
        location /ime/ {
            expires 1d;
            add_header Cache-Control "public";
        }

        location /icons/ {
            expires 1d;
            add_header Cache-Control "public";
        }

        # 地图缓存未命中必须明确 404（对齐 vite preview 中间件语义），
        # 不能落进 SPA fallback 把 index.html 当缓存文件返回
        location /map-cache/ {
            try_files $uri =404;
        }

        location /map-vector-cache/ {
            try_files $uri =404;
        }

        location /api/gw/ {
            proxy_pass http://127.0.0.1:__API_PORT__;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # 论文 landing 页（直接 alias 到 web/，本地编辑即时生效，无需 build）
        location /paper/ {
            alias __ROOT__/web/;
            try_files $uri $uri/ /paper/index.html;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        # 外部媒体/数据镜像（图片 + JSON）。物理路径在仓库根 mobilegym-data/（gitignored）。
        location /cdn/ {
            alias __ROOT__/mobilegym-data/;
            expires 30d;
            add_header Cache-Control "public, immutable, max-age=2592000";
            access_log off;                # 不记 200/304，省 IO
            tcp_nodelay on;                # 小响应立刻发
            sendfile on;
            sendfile_max_chunk 1m;
            try_files $uri =404;
        }

        # index.html 不缓存，确保 rebuild 后立刻生效
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
